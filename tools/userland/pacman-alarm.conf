# Mirror is plaintext HTTP: verified (2026-09) that mirror.archlinuxarm.org's
# geo-redirect targets don't serve working HTTPS (either refuse the TLS
# connection or present a certificate for a different hostname) -- ALARM's
# mirror network has no reliable per-mirror HTTPS, unlike archlinux.org's.
# Every package pacman installs is still SigLevel=Required (checked below),
# and the one thing that bootstraps *into* that trust (archlinuxarm-keyring
# itself) is checksum-pinned in build-rootfs.sh (F11, security-review.md)
# instead, since that's the control that actually survives a MITM on this
# transport.
[options]
Architecture = aarch64
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo
[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo
[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo
