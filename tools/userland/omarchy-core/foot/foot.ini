# Omarchy on the Omarchy Phone: the image's foot settings, then the current
# Omarchy theme's colours (written by omarchy-theme-set; retinted live by
# omarchy-theme-set-foot). Font as in Omarchy, sized for the phone.
[main]
include=/etc/xdg/foot/foot.ini
font=JetBrainsMono Nerd Font:size=8
include=~/.local/state/omarchy/current/theme/foot.ini
