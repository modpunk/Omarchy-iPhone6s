# sshd_config.d/10-phone.conf pins ListenAddress to 172.16.42.1 (F7,
# security-review.md), so bind() needs usb0 to already have that address.
# It does in practice -- the ramdisk configures it before switch_root and
# 10-usb-gadget.network's KeepConfiguration=yes keeps it across the switch --
# but order after networkd and back off a couple of seconds between restarts
# instead of the package default (~100ms), the same way phone-telnetd.service
# already does for the same address, in case that ever isn't true (a fresh
# ramdisk revision, nsboot, a different bring-up order).
[Unit]
After=systemd-networkd.service

[Service]
RestartSec=2
