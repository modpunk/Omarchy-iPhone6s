# The root filesystem lives in tmpfs; tmpfs pages can swap out to zram, which
# keeps cold parts of the rootfs compressed in RAM. On a 2 GiB phone the old
# ram/2 formula was already pinned at its 1024 MiB cap; raised so there's
# headroom to swap out more of the ~900 MiB tmpfs root when memory is tight
# (real RAM used is the compressed size, typically 2-3x smaller). See
# etc/sysctl.d/99-phone-zram.conf for the swappiness this depends on.
[zram0]
zram-size = min(ram * 3 / 4, 1536)
compression-algorithm = zstd
