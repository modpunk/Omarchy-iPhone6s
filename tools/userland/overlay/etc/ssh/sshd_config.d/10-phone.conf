# USB point-to-point link only. Bind explicitly so sshd doesn't start
# answering on Wi-Fi the day a Wi-Fi driver brings up another interface (F7,
# security-review.md): this must be the only listener, on the USB gadget
# address, whether or not usb0 is the only interface that exists yet.
ListenAddress 172.16.42.1
PermitRootLogin prohibit-password
PasswordAuthentication yes
KbdInteractiveAuthentication no
UseDNS no
