#!/usr/bin/nft -f
# Default-deny inbound firewall (F9, security-review.md). Today only lo and
# usb0 (the USB point-to-point link, 172.16.42.1/24) exist; this ruleset
# allows both and drops everything else unsolicited, so a Wi-Fi interface
# that shows up later (brcmfmac/iwd) comes up already deny-by-default instead
# of the cutover having to remember to add a firewall at the same time.
# Loaded by nftables.service (enabled in build-rootfs.sh stage_config).
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		iifname "usb0" accept

		ct state established,related accept
		ct state invalid drop

		# ICMP is diagnostic, not a service: allow it everywhere so `ping`
		# still works for troubleshooting even from an interface that isn't
		# otherwise trusted yet.
		icmp type echo-request accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
