# Out-of-tree drivers for the iPhone 6s (built with the kernel, installed by
# build-rootfs.sh into /lib/modules/<release>/extra). Loaded in this order.
# Bluetooth power GPIOs on the PMIC: hci_bcm defers its probe until this is up.
gpio-apple-pmic
# Battery gauge: the charger's mux first, then the bq27540 over HDQ/UART.
mux-sn2400
bq27xxx_battery_hdq_uart
