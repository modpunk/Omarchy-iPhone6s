# zram (see etc/systemd/zram-generator.conf) is RAM-to-RAM compressed swap,
# an order of magnitude faster than any real swap device, so it's worth
# swapping out cold pages early rather than waiting for memory pressure:
# vm.swappiness's usual "avoid swap" bias assumes swap is slow disk.
vm.swappiness = 150
# Swap readahead clustering is a disk-seek optimization; zram has no seek
# cost, and reading extra compressed pages just burns CPU decompressing
# pages nobody asked for yet.
vm.page-cluster = 0
